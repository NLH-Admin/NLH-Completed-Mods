name: Restore NLH Repository Files To Root

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  restore-files-to-root:
    name: Restore organized repository files to root
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and restore files to repository root
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd()
          index_path = root / os.environ["INDEX_FILE"]
          organized_roots = (
              root / "Release Versions",
              root / "Mods",
              root / "Assets",
          )

          files_to_restore = sorted(
              (
                  path
                  for organized_root in organized_roots
                  if organized_root.is_dir()
                  for path in organized_root.rglob("*")
                  if path.is_file()
              ),
              key=lambda path: path.relative_to(root).as_posix().casefold(),
          )

          destinations = {}
          conflicts = []

          for source in files_to_restore:
              destination = root / source.name
              key = source.name.casefold()

              if key in destinations:
                  conflicts.append(
                      "Duplicate filename after flattening: "
                      f"{destinations[key].relative_to(root).as_posix()} and "
                      f"{source.relative_to(root).as_posix()}"
                  )
              else:
                  destinations[key] = source

              if destination.exists() and destination != source:
                  conflicts.append(
                      "Root destination already exists: "
                      f"{destination.name}"
                  )

          if conflicts:
              for conflict in conflicts:
                  print(f"::error title=NLH root restore conflict::{conflict}")
              raise SystemExit(1)

          for source in files_to_restore:
              destination = root / source.name
              source.replace(destination)
              print(
                  "Restored: "
                  f"{source.relative_to(root).as_posix()} -> {destination.name}"
              )

          # The generated index describes nested paths and must be rebuilt by
          # the original root-layout workflow after restoration.
          if index_path.is_file():
              index_path.unlink()
              print(f"Removed generated nested-layout index: {index_path.name}")

          print(f"Restored {len(files_to_restore)} files to the repository root.")
          PY

      - name: Commit and push restored root layout
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "No root-layout restoration changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged root-layout restoration changes."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Restore NLH repository files to root"

          if git push origin HEAD:main; then
            exit 0
          fi

          git pull --rebase origin main
          git push origin HEAD:main
