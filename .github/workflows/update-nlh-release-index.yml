name: Rebuild NLH Repository Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "NLH Repository Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-repository-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate repository index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          index_signature = "NLH-REPOSITORY-INDEX|1"
          index_header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          manager_name = "NLH Mod Manager.vbs"
          squad_profiles_name = "NLH Mod Manager Squad Profiles.txt"
          icon_name = "NLH_MM.ico"

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>[1-9]\d*\.\d+)\.vbs$",
              re.IGNORECASE,
          )

          release_private_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>[1-9]\d*\.\d+)_Private\.txt$",
              re.IGNORECASE,
          )

          mod_pattern = re.compile(
              r"^(?P<character>.+)_(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )

          def get_git_blob_sha(path: Path) -> str:
              result = subprocess.run(
                  ["git", "hash-object", "--", str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip().lower()

          def get_sha256(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def get_raw_path(path: Path) -> str:
              relative_path = path.relative_to(root).as_posix()

              return "/".join(
                  quote(part, safe="")
                  for part in relative_path.split("/")
              )

          def clean_field(value) -> str:
              return (
                  str(value)
                  .replace("|", "")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          def create_row(
              item_type: str,
              path: Path,
              version: str = "",
              character: str = "",
              base_name: str = "",
              private_metadata: str = "",
              changelog: str = "",
          ) -> str:
              values = [
                  item_type,
                  path.name,
                  get_raw_path(path),
                  get_git_blob_sha(path),
                  get_sha256(path),
                  str(path.stat().st_size),
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ]

              return "|".join(
                  clean_field(value)
                  for value in values
              )

          def version_key(version: str):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )

          all_files = sorted(
              (
                  path
                  for path in root.rglob("*")
                  if path.is_file()
                  and ".git" not in path.parts
                  and path.relative_to(root).as_posix() != index_name
              ),
              key=lambda path: (
                  path.relative_to(root)
                  .as_posix()
                  .casefold()
              ),
          )

          files_by_name = {
              path.name.casefold(): path
              for path in all_files
          }

          rows = []

          manager_path = files_by_name.get(
              manager_name.casefold()
          )

          if manager_path is None:
              raise SystemExit(
                  f"Required launcher is missing: {manager_name}"
              )

          rows.append(
              create_row(
                  "MANAGER",
                  manager_path,
                  base_name=manager_path.stem,
              )
          )

          releases = []
          release_private_files = []
          squad_profile_files = []
          icon_files = []
          mods = []
          private_files = []

          for path in all_files:
              if path == manager_path:
                  continue

              name = path.name

              release_match = release_pattern.fullmatch(name)

              if release_match:
                  releases.append(
                      (
                          path,
                          release_match.group("version"),
                      )
                  )
                  continue

              release_private_match = (
                  release_private_pattern.fullmatch(name)
              )

              if release_private_match:
                  release_private_files.append(
                      (
                          path,
                          release_private_match.group("version"),
                      )
                  )
                  continue

              if (
                  name.casefold()
                  == squad_profiles_name.casefold()
              ):
                  squad_profile_files.append(path)
                  continue

              if name.casefold() == icon_name.casefold():
                  icon_files.append(path)
                  continue

              mod_match = mod_pattern.fullmatch(name)

              if mod_match:
                  mods.append(
                      (
                          path,
                          mod_match.group("version"),
                          mod_match.group("character"),
                      )
                  )
                  continue

              if name.casefold().endswith("_private.txt"):
                  private_files.append(path)

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem
              private_name = f"{base_name}_Private.txt"

              if (
                  private_name.casefold()
                  in files_by_name
              ):
                  private_metadata = private_name
              else:
                  private_metadata = ""

              rows.append(
                  create_row(
                      "RELEASE",
                      path,
                      version=version,
                      base_name=base_name,
                      private_metadata=private_metadata,
                  )
              )

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.name[
                  : -len("_Private.txt")
              ]

              rows.append(
                  create_row(
                      "RELEASE_PRIVATE",
                      path,
                      version=version,
                      base_name=base_name,
                  )
              )

          for path in sorted(
              squad_profile_files,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  create_row(
                      "SQUAD_PROFILES",
                      path,
                      base_name=path.stem,
                  )
              )

          for path in sorted(
              icon_files,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  create_row(
                      "ICON",
                      path,
                      base_name=path.stem,
                  )
              )

          for path, version, character in sorted(
              mods,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              changelog_name = (
                  f"{base_name}_Changelog.txt"
              )

              if (
                  private_name.casefold()
                  in files_by_name
              ):
                  private_metadata = private_name
              else:
                  private_metadata = ""

              if (
                  changelog_name.casefold()
                  in files_by_name
              ):
                  changelog = changelog_name
              else:
                  changelog = ""

              rows.append(
                  create_row(
                      "MOD",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      private_metadata=private_metadata,
                      changelog=changelog,
                  )
              )

          release_private_names = {
              path.name.casefold()
              for path, _ in release_private_files
          }

          for path in sorted(
              private_files,
              key=lambda item: item.name.casefold(),
          ):
              if (
                  path.name.casefold()
                  in release_private_names
              ):
                  continue

              base_name = path.name[
                  : -len("_Private.txt")
              ]

              rows.append(
                  create_row(
                      "PRIVATE",
                      path,
                      base_name=base_name,
                  )
              )

          output_lines = [
              index_signature,
              index_header,
              *rows,
          ]

          output = "\n".join(output_lines) + "\n"

          index_path.write_text(
              output,
              encoding="utf-8",
              newline="\n",
          )

          print(
              f"Generated {index_name} "
              f"with {len(rows)} records."
          )
          PY

      - name: Verify generated index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          index_path = Path(os.environ["INDEX_FILE"])

          expected_signature = (
              "NLH-REPOSITORY-INDEX|1"
          )

          expected_header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          if not index_path.is_file():
              raise SystemExit(
                  "The generated repository index is missing."
              )

          lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if not lines:
              raise SystemExit(
                  "The generated repository index is empty."
              )

          if lines[0] != expected_signature:
              raise SystemExit(
                  "Invalid repository-index signature."
              )

          if len(lines) < 2:
              raise SystemExit(
                  "The repository-index header is missing."
              )

          if lines[1] != expected_header:
              raise SystemExit(
                  "Invalid repository-index header."
              )

          records = {}
          duplicate_names = set()

          for line_number, line in enumerate(
              lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  raise SystemExit(
                      f"Invalid field count on line "
                      f"{line_number}: {len(fields)}"
                  )

              (
                  item_type,
                  name,
                  raw_path,
                  git_blob_sha,
                  sha256_value,
                  size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              if not item_type:
                  raise SystemExit(
                      f"Missing type on line {line_number}."
                  )

              if not name:
                  raise SystemExit(
                      f"Missing filename on line "
                      f"{line_number}."
                  )

              name_key = name.casefold()

              if name_key in records:
                  duplicate_names.add(name)

              records[name_key] = fields

              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"Indexed file is missing: {name}"
                  )

              expected_raw_path = "/".join(
                  quote(part, safe="")
                  for part in path.as_posix().split("/")
              )

              if raw_path != expected_raw_path:
                  raise SystemExit(
                      f"RAW_PATH mismatch: {name}"
                  )

              blob_result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      str(path),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              expected_blob_sha = (
                  blob_result.stdout
                  .strip()
                  .lower()
              )

              if (
                  git_blob_sha.lower()
                  != expected_blob_sha
              ):
                  raise SystemExit(
                      f"Git blob SHA mismatch: {name}"
                  )

              expected_sha256 = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

              if sha256_value.lower() != expected_sha256:
                  raise SystemExit(
                      f"SHA-256 mismatch: {name}"
                  )

              expected_size = str(
                  path.stat().st_size
              )

              if size != expected_size:
                  raise SystemExit(
                      f"Size mismatch: {name}"
                  )

          if duplicate_names:
              raise SystemExit(
                  "Duplicate index filenames: "
                  + ", ".join(sorted(duplicate_names))
              )

          required_files = [
              (
                  "MANAGER",
                  "NLH Mod Manager.vbs",
                  "",
              ),
              (
                  "RELEASE",
                  "NLH Mod Manager Public Release V1.0.vbs",
                  "1.0",
              ),
              (
                  "RELEASE",
                  "NLH Mod Manager Public Release V1.1.vbs",
                  "1.1",
              ),
          ]

          for (
              expected_type,
              name,
              expected_version,
          ) in required_files:
              record = records.get(name.casefold())

              if record is None:
                  raise SystemExit(
                      f"Required file is absent "
                      f"from the index: {name}"
                  )

              if record[0] != expected_type:
                  raise SystemExit(
                      f"Incorrect index type for {name}: "
                      f"{record[0]}"
                  )

              if (
                  expected_version
                  and record[6] != expected_version
              ):
                  raise SystemExit(
                      f"Incorrect version for {name}: "
                      f"{record[6]}"
                  )

          v11_record = records[
              (
                  "NLH Mod Manager Public "
                  "Release V1.1.vbs"
              ).casefold()
          ]

          v11_private_name = (
              "NLH Mod Manager Public "
              "Release V1.1_Private.txt"
          )

          if (
              v11_private_name.casefold()
              in records
          ):
              if (
                  v11_record[9]
                  != v11_private_name
              ):
                  raise SystemExit(
                      "The V1.1 release does not reference "
                      "its private metadata file."
                  )

              private_record = records[
                  v11_private_name.casefold()
              ]

              if private_record[0] != "RELEASE_PRIVATE":
                  raise SystemExit(
                      "The V1.1 private metadata record "
                      "has the wrong type."
                  )

              if private_record[6] != "1.1":
                  raise SystemExit(
                      "The V1.1 private metadata record "
                      "has the wrong version."
                  )

          print(
              "Repository index verification completed "
              "successfully."
          )
          PY

      - name: Commit updated index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          if git diff --quiet -- "$INDEX_FILE"; then
            echo "Repository index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          git commit \
            -m "Update NLH repository index"

          git push
