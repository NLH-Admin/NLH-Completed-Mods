name: Update NLH Mod Manager Release Index

on:
  push:
    branches:
      - main
    paths:
      - "NLH Mod Manager Public Release V*.vbs"
      - "NLH Mod Manager Public Release V*_Private.txt"
      - ".github/workflows/update-nlh-manager-release-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  update-release-index:
    name: Update NLH Mod Manager release index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update and verify manager release records
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          signature = "NLH-REPOSITORY-INDEX|1"

          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)\.vbs$",
              re.IGNORECASE,
          )

          private_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)_Private\.txt$",
              re.IGNORECASE,
          )

          required_releases = {
              "1.0": "NLH Mod Manager Public Release V1.0.vbs",
              "1.1": "NLH Mod Manager Public Release V1.1.vbs",
          }

          def fail(message):
              print(
                  f"::error title=NLH release index failure::{message}",
                  flush=True,
              )
              raise SystemExit(1)

          def notice(message):
              print(
                  f"::notice title=NLH release index::{message}",
                  flush=True,
              )

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def git_blob_sha(path):
              result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      path.name,
                  ],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              value = result.stdout.strip().lower()

              if not re.fullmatch(
                  r"[0-9a-f]{40}",
                  value,
              ):
                  fail(
                      f"Invalid Git blob SHA for {path.name}"
                  )

              return value

          def raw_path(path):
              return quote(
                  path.name,
                  safe="",
              )

          def clean_field(value):
              return (
                  str(value)
                  .replace("|", "")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          def release_row(path, version):
              base_name = path.stem
              private_name = f"{base_name}_Private.txt"
              private_path = root / private_name

              fields = [
                  "RELEASE",
                  path.name,
                  raw_path(path),
                  git_blob_sha(path),
                  sha256_file(path),
                  str(path.stat().st_size),
                  version,
                  "",
                  base_name,
                  private_name if private_path.is_file() else "",
                  "",
              ]

              return "|".join(
                  clean_field(field)
                  for field in fields
              )

          def private_row(path, version):
              base_name = path.name[
                  : -len("_Private.txt")
              ]

              fields = [
                  "RELEASE_PRIVATE",
                  path.name,
                  raw_path(path),
                  git_blob_sha(path),
                  sha256_file(path),
                  str(path.stat().st_size),
                  version,
                  "",
                  base_name,
                  "",
                  "",
              ]

              return "|".join(
                  clean_field(field)
                  for field in fields
              )

          if not index_path.is_file():
              fail(
                  f"Required index file is missing: {index_name}"
              )

          original_lines = index_path.read_text(
              encoding="utf-8-sig"
          ).splitlines()

          if len(original_lines) < 2:
              fail(
                  "The existing release index is incomplete."
              )

          if original_lines[0] != signature:
              fail(
                  "The existing release index has "
                  "an invalid signature."
              )

          if original_lines[1] != header:
              fail(
                  "The existing release index has "
                  "an invalid header."
              )

          current_release_files = {}
          current_private_files = {}

          for path in root.iterdir():
              if not path.is_file():
                  continue

              release_match = release_pattern.fullmatch(
                  path.name
              )

              if release_match:
                  version = release_match.group(
                      "version"
                  )

                  if version in current_release_files:
                      fail(
                          "Duplicate manager release "
                          f"version V{version}."
                      )

                  current_release_files[version] = path
                  continue

              private_match = private_pattern.fullmatch(
                  path.name
              )

              if private_match:
                  version = private_match.group(
                      "version"
                  )

                  if version in current_private_files:
                      fail(
                          "Duplicate manager private metadata "
                          f"version V{version}."
                      )

                  current_private_files[version] = path

          for version, required_name in (
              required_releases.items()
          ):
              release_path = current_release_files.get(
                  version
              )

              if release_path is None:
                  fail(
                      f"Required release is missing: {required_name}"
                  )

              if release_path.name != required_name:
                  fail(
                      f"Release V{version} must use the "
                      f"exact filename {required_name}."
                  )

          replacement_release_rows = {
              version: release_row(path, version)
              for version, path
              in current_release_files.items()
          }

          replacement_private_rows = {
              version: private_row(path, version)
              for version, path
              in current_private_files.items()
          }

          output_lines = [
              signature,
              header,
          ]

          written_release_versions = set()
          written_private_versions = set()

          for line_number, line in enumerate(
              original_lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  fail(
                      f"Existing index line {line_number} "
                      f"has {len(fields)} fields instead of 11."
                  )

              item_type = fields[0]
              name = fields[1]
              version = fields[6]

              if item_type == "RELEASE":
                  match = release_pattern.fullmatch(
                      name
                  )

                  if match:
                      detected_version = match.group(
                          "version"
                      )

                      replacement = (
                          replacement_release_rows.get(
                              detected_version
                          )
                      )

                      if replacement is not None:
                          output_lines.append(
                              replacement
                          )

                          written_release_versions.add(
                              detected_version
                          )

                      continue

              if item_type == "RELEASE_PRIVATE":
                  match = private_pattern.fullmatch(
                      name
                  )

                  if match:
                      detected_version = match.group(
                          "version"
                      )

                      replacement = (
                          replacement_private_rows.get(
                              detected_version
                          )
                      )

                      if replacement is not None:
                          output_lines.append(
                              replacement
                          )

                          written_private_versions.add(
                              detected_version
                          )

                      continue

              output_lines.append(line)

          missing_release_versions = sorted(
              set(replacement_release_rows)
              - written_release_versions,
              key=lambda value: tuple(
                  int(part)
                  for part in value.split(".")
              ),
          )

          for version in missing_release_versions:
              output_lines.append(
                  replacement_release_rows[version]
              )

              written_release_versions.add(version)

          missing_private_versions = sorted(
              set(replacement_private_rows)
              - written_private_versions,
              key=lambda value: tuple(
                  int(part)
                  for part in value.split(".")
              ),
          )

          for version in missing_private_versions:
              output_lines.append(
                  replacement_private_rows[version]
              )

              written_private_versions.add(version)

          updated_text = (
              "\n".join(output_lines)
              + "\n"
          )

          index_path.write_text(
              updated_text,
              encoding="utf-8",
              newline="\n",
          )

          verified_release_versions = set()
          verified_private_versions = set()

          final_lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if final_lines[0] != signature:
              fail(
                  "The updated index signature is invalid."
              )

          if final_lines[1] != header:
              fail(
                  "The updated index header is invalid."
              )

          for line_number, line in enumerate(
              final_lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  fail(
                      f"Updated index line {line_number} "
                      f"has {len(fields)} fields instead of 11."
                  )

              (
                  item_type,
                  name,
                  stored_raw_path,
                  stored_blob_sha,
                  stored_sha256,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              if item_type == "RELEASE":
                  match = release_pattern.fullmatch(
                      name
                  )

                  if not match:
                      continue

                  detected_version = match.group(
                      "version"
                  )

                  path = current_release_files.get(
                      detected_version
                  )

                  if path is None:
                      fail(
                          "The updated index contains a "
                          "release that is not present: "
                          f"{name}"
                      )

                  if version != detected_version:
                      fail(
                          f"VERSION mismatch for {name}."
                      )

                  if stored_raw_path != raw_path(path):
                      fail(
                          f"RAW_PATH mismatch for {name}."
                      )

                  if stored_blob_sha != git_blob_sha(path):
                      fail(
                          f"Git blob SHA mismatch for {name}."
                      )

                  if stored_sha256 != sha256_file(path):
                      fail(
                          f"SHA-256 mismatch for {name}."
                      )

                  if stored_size != str(
                      path.stat().st_size
                  ):
                      fail(
                          f"Size mismatch for {name}."
                      )

                  expected_private_name = (
                      f"{path.stem}_Private.txt"
                  )

                  expected_private_value = (
                      expected_private_name
                      if (
                          root
                          / expected_private_name
                      ).is_file()
                      else ""
                  )

                  if (
                      private_metadata
                      != expected_private_value
                  ):
                      fail(
                          "PRIVATE_METADATA mismatch for "
                          f"{name}."
                      )

                  verified_release_versions.add(
                      detected_version
                  )

              elif item_type == "RELEASE_PRIVATE":
                  match = private_pattern.fullmatch(
                      name
                  )

                  if not match:
                      continue

                  detected_version = match.group(
                      "version"
                  )

                  path = current_private_files.get(
                      detected_version
                  )

                  if path is None:
                      fail(
                          "The updated index contains private "
                          "metadata that is not present: "
                          f"{name}"
                      )

                  if version != detected_version:
                      fail(
                          f"VERSION mismatch for {name}."
                      )

                  if stored_raw_path != raw_path(path):
                      fail(
                          f"RAW_PATH mismatch for {name}."
                      )

                  if stored_blob_sha != git_blob_sha(path):
                      fail(
                          f"Git blob SHA mismatch for {name}."
                      )

                  if stored_sha256 != sha256_file(path):
                      fail(
                          f"SHA-256 mismatch for {name}."
                      )

                  if stored_size != str(
                      path.stat().st_size
                  ):
                      fail(
                          f"Size mismatch for {name}."
                      )

                  verified_private_versions.add(
                      detected_version
                  )

          for version in required_releases:
              if (
                  version
                  not in verified_release_versions
              ):
                  fail(
                      "The updated index does not contain "
                      f"a verified V{version} RELEASE row."
                  )

          for version in current_private_files:
              if (
                  version
                  not in verified_private_versions
              ):
                  fail(
                      "The updated index does not contain "
                      f"a verified V{version} "
                      "RELEASE_PRIVATE row."
                  )

          print(
              f"Updated {index_name} successfully."
          )

          for version in sorted(
              required_releases,
              key=lambda value: tuple(
                  int(part)
                  for part in value.split(".")
              ),
          ):
              path = current_release_files[
                  version
              ]

              print(
                  f"V{version}: "
                  f"size={path.stat().st_size} "
                  f"sha256={sha256_file(path)} "
                  f"blob={git_blob_sha(path)}"
              )

          notice(
              "All current manager release records "
              "were regenerated and verified."
          )
          PY

      - name: Display updated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Updated release index:"
          echo

          cat -- "$INDEX_FILE"

      - name: Commit and push updated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Git status before staging:"
          git status --short

          if [ -z "$(git status --porcelain -- "$INDEX_FILE")" ]; then
            echo "Release index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          if git diff --cached --quiet; then
            echo "No staged release-index changes."
            exit 0
          fi

          echo "Staged release-index change:"
          git diff --cached --stat

          git commit \
            -m "Update NLH Mod Manager release index"

          if git push origin HEAD:main; then
            echo "Release index pushed successfully."
            exit 0
          fi

          echo "Initial push was rejected."
          echo "Rebasing onto the latest main branch."

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main

          echo "Release index pushed successfully after rebasing."
