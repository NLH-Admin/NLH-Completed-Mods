name: Rebuild NLH Mod Manager Release Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "NLH Mod Manager Release Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  rebuild-index:
    name: Rebuild NLH Mod Manager release index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and verify release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          signature = "NLH-REPOSITORY-INDEX|1"

          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          manager_name = "NLH Mod Manager.vbs"
          squad_profiles_name = "NLH Mod Manager Squad Profiles.txt"
          icon_name = "NLH_MM.ico"

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)\.vbs$",
              re.IGNORECASE,
          )

          release_private_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)_Private\.txt$",
              re.IGNORECASE,
          )

          mod_pattern = re.compile(
              r"^(?P<character>.+)_"
              r"(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )

          def fail(message):
              print(
                  f"::error title=NLH release index failure::{message}",
                  flush=True,
              )
              raise SystemExit(1)

          def notice(message):
              print(
                  f"::notice title=NLH release index::{message}",
                  flush=True,
              )

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def git_blob_sha(path):
              result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      path.name,
                  ],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              value = result.stdout.strip().lower()

              if not re.fullmatch(
                  r"[0-9a-f]{40}",
                  value,
              ):
                  fail(
                      f"Invalid Git blob SHA for {path.name}"
                  )

              return value

          def raw_path(path):
              return quote(
                  path.name,
                  safe="",
              )

          def clean(value):
              return (
                  str(value)
                  .replace("|", "")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          def version_key(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )

          def make_row(
              item_type,
              path,
              version="",
              character="",
              base_name="",
              private_metadata="",
              changelog="",
          ):
              fields = [
                  item_type,
                  path.name,
                  raw_path(path),
                  git_blob_sha(path),
                  sha256_file(path),
                  str(path.stat().st_size),
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ]

              return "|".join(
                  clean(field)
                  for field in fields
              )

          files = sorted(
              (
                  path
                  for path in root.iterdir()
                  if path.is_file()
                  and path.name != index_name
              ),
              key=lambda path: path.name.casefold(),
          )

          if not files:
              fail(
                  "No files were found in the repository root."
              )

          files_by_name = {}

          for path in files:
              key = path.name.casefold()

              if key in files_by_name:
                  fail(
                      f"Duplicate root filename: {path.name}"
                  )

              files_by_name[key] = path

          manager = files_by_name.get(
              manager_name.casefold()
          )

          releases = []
          release_private_files = []
          squad_profile_files = []
          icon_files = []
          mod_files = []
          private_files = []

          for path in files:
              if (
                  manager is not None
                  and path == manager
              ):
                  continue

              release_match = (
                  release_pattern.fullmatch(path.name)
              )

              if release_match:
                  releases.append(
                      (
                          path,
                          release_match.group("version"),
                      )
                  )
                  continue

              release_private_match = (
                  release_private_pattern.fullmatch(
                      path.name
                  )
              )

              if release_private_match:
                  release_private_files.append(
                      (
                          path,
                          release_private_match.group(
                              "version"
                          ),
                      )
                  )
                  continue

              if (
                  path.name.casefold()
                  == squad_profiles_name.casefold()
              ):
                  squad_profile_files.append(path)
                  continue

              if (
                  path.name.casefold()
                  == icon_name.casefold()
              ):
                  icon_files.append(path)
                  continue

              mod_match = mod_pattern.fullmatch(
                  path.name
              )

              if mod_match:
                  mod_files.append(
                      (
                          path,
                          mod_match.group("version"),
                          mod_match.group("character"),
                      )
                  )
                  continue

              if path.name.casefold().endswith(
                  "_private.txt"
              ):
                  private_files.append(path)

          releases_by_version = {}

          for path, version in releases:
              if version in releases_by_version:
                  fail(
                      "Duplicate public manager release "
                      f"V{version}."
                  )

              releases_by_version[version] = path

          required_releases = {
              "1.0": (
                  "NLH Mod Manager Public Release "
                  "V1.0.vbs"
              ),
              "1.1": (
                  "NLH Mod Manager Public Release "
                  "V1.1.vbs"
              ),
          }

          for version, required_name in (
              required_releases.items()
          ):
              path = releases_by_version.get(
                  version
              )

              if path is None:
                  fail(
                      "Required release is missing: "
                      f"{required_name}"
                  )

              if path.name != required_name:
                  fail(
                      f"Release V{version} must use "
                      f"the exact filename {required_name}."
                  )

          rows = []

          if manager is not None:
              rows.append(
                  make_row(
                      "MANAGER",
                      manager,
                      base_name=manager.stem,
                  )
              )

              notice(
                  "Included the current launcher in "
                  "the generated release index."
              )
          else:
              notice(
                  "The current baseline predates remote "
                  "launcher updating, so no MANAGER row "
                  "was generated."
              )

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold()
                  in files_by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "RELEASE",
                      path,
                      version=version,
                      base_name=base_name,
                      private_metadata=private_metadata,
                  )
              )

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              rows.append(
                  make_row(
                      "RELEASE_PRIVATE",
                      path,
                      version=version,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          for path in sorted(
              squad_profile_files,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "SQUAD_PROFILES",
                      path,
                      base_name=path.stem,
                  )
              )

          for path in sorted(
              icon_files,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "ICON",
                      path,
                      base_name=path.stem,
                  )
              )

          for path, version, character in sorted(
              mod_files,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              changelog_name = (
                  f"{base_name}_Changelog.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold()
                  in files_by_name
                  else ""
              )

              changelog = (
                  changelog_name
                  if changelog_name.casefold()
                  in files_by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "MOD",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      private_metadata=private_metadata,
                      changelog=changelog,
                  )
              )

          release_private_names = {
              path.name.casefold()
              for path, unused_version
              in release_private_files
          }

          for path in sorted(
              private_files,
              key=lambda item: item.name.casefold(),
          ):
              if (
                  path.name.casefold()
                  in release_private_names
              ):
                  continue

              rows.append(
                  make_row(
                      "PRIVATE",
                      path,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          index_text = (
              "\n".join(
                  [
                      signature,
                      header,
                      *rows,
                  ]
              )
              + "\n"
          )

          index_path.write_text(
              index_text,
              encoding="utf-8",
              newline="\n",
          )

          lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if len(lines) < 2:
              fail(
                  "The generated release index is incomplete."
              )

          if lines[0] != signature:
              fail(
                  "The generated release index has "
                  "an invalid signature."
              )

          if lines[1] != header:
              fail(
                  "The generated release index has "
                  "an invalid header."
              )

          records = {}
          raw_paths = set()

          for line_number, line in enumerate(
              lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  fail(
                      f"Index line {line_number} has "
                      f"{len(fields)} fields instead of 11."
                  )

              (
                  item_type,
                  name,
                  stored_raw_path,
                  stored_blob_sha,
                  stored_sha256,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              file_path = files_by_name.get(
                  name.casefold()
              )

              if file_path is None:
                  fail(
                      f"Indexed file is unavailable: {name}"
                  )

              expected_raw_path = raw_path(
                  file_path
              )

              if (
                  stored_raw_path
                  != expected_raw_path
              ):
                  fail(
                      f"RAW_PATH mismatch for {name}. "
                      f"Stored: {stored_raw_path}. "
                      f"Expected: {expected_raw_path}."
                  )

              expected_blob_sha = git_blob_sha(
                  file_path
              )

              if (
                  stored_blob_sha
                  != expected_blob_sha
              ):
                  fail(
                      f"Git blob SHA mismatch for {name}."
                  )

              expected_sha256 = sha256_file(
                  file_path
              )

              if (
                  stored_sha256
                  != expected_sha256
              ):
                  fail(
                      f"SHA-256 mismatch for {name}."
                  )

              expected_size = str(
                  file_path.stat().st_size
              )

              if stored_size != expected_size:
                  fail(
                      f"Size mismatch for {name}. "
                      f"Stored: {stored_size}. "
                      f"Expected: {expected_size}."
                  )

              name_key = name.casefold()
              raw_key = stored_raw_path.casefold()

              if name_key in records:
                  fail(
                      "Duplicate NAME in generated "
                      f"index: {name}"
                  )

              if raw_key in raw_paths:
                  fail(
                      "Duplicate RAW_PATH in generated "
                      f"index: {stored_raw_path}"
                  )

              records[name_key] = fields
              raw_paths.add(raw_key)

          for version, required_name in (
              required_releases.items()
          ):
              record = records.get(
                  required_name.casefold()
              )

              if record is None:
                  fail(
                      "Required release is absent from "
                      f"the generated index: {required_name}"
                  )

              if record[0] != "RELEASE":
                  fail(
                      f"Incorrect TYPE for {required_name}: "
                      f"{record[0]}"
                  )

              if record[6] != version:
                  fail(
                      f"Incorrect VERSION for "
                      f"{required_name}: {record[6]}"
                  )

          v11_name = required_releases["1.1"]

          v11_private_name = (
              "NLH Mod Manager Public Release "
              "V1.1_Private.txt"
          )

          v11_record = records[
              v11_name.casefold()
          ]

          v11_private_record = records.get(
              v11_private_name.casefold()
          )

          if v11_private_record is not None:
              if (
                  v11_record[9]
                  != v11_private_name
              ):
                  fail(
                      "The V1.1 RELEASE row does not "
                      "reference its private metadata file."
                  )

              if (
                  v11_private_record[0]
                  != "RELEASE_PRIVATE"
              ):
                  fail(
                      "The V1.1 private metadata row "
                      "has the wrong TYPE."
                  )

              if (
                  v11_private_record[6]
                  != "1.1"
              ):
                  fail(
                      "The V1.1 private metadata row "
                      "has the wrong VERSION."
                  )

          elif v11_recordfail(
                  "The V1.1 RELEASE row references "
                  "private metadata that is not indexed."
              )

          print(
              f"Generated {index_name} "
              f"with {len(rows)} records."
          )

          for version in ("1.0", "1.1"):
              required_name = (
                  required_releases[version]
              )

              record = records[
                  required_name.casefold()
              ]

              print(
                  f"V{version}: "
                  f"size={record[5]} "
                  f"sha256={record[4]} "
                  f"blob={record[3]}"
              )

          print(
              "Release index verification "
              "completed successfully."
          )
          PY

      - name: Display generated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Generated release index:"
          echo

          cat -- "$INDEX_FILE"

      - name: Commit and push updated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Git status before staging:"
          git status --short

          if [ -z "$(git status --porcelain -- "$INDEX_FILE")" ]; then
            echo "Release index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          echo "Staged release-index change:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No staged release-index change was found."
            exit 0
          fi

          git commit \
            -m "Update NLH Mod Manager release index"

          if git push origin HEAD:main; then
            echo "Release index pushed successfully."
            exit 0
          fi

          echo "Initial push was rejected."
          echo "Rebasing the generated commit onto the latest main branch."

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main

          echo "Release index pushed successfully after rebasing."
