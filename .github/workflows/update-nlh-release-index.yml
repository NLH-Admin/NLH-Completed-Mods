name: Update NLH Mod Manager Release Index

on:
  push:
    branches: [main]
    paths-ignore:
      - "NLH Mod Manager Release Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  update-release-index:
    name: Update NLH Mod Manager release index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild and verify complete release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import hashlib
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import quote, unquote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name
          signature = "NLH-REPOSITORY-INDEX|1"
          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )
          field_count = 11

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release V(?P<version>\d+(?:\.\d+)*)\.vbs$",
              re.IGNORECASE,
          )
          release_private_pattern = re.compile(
              r"^NLH Mod Manager Public Release V(?P<version>\d+(?:\.\d+)*)_Private\.txt$",
              re.IGNORECASE,
          )
          manager_pattern = re.compile(r"^NLH Mod Manager\.vbs$", re.IGNORECASE)
          profiles_pattern = re.compile(
              r"^NLH Mod Manager Squad Profiles\.txt$",
              re.IGNORECASE,
          )
          mod_pattern = re.compile(
              r"^(?P<character>.+)_(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )
          private_pattern = re.compile(
              r"^(?P<base>.+)_Private\.txt$",
              re.IGNORECASE,
          )
          changelog_pattern = re.compile(
              r"^(?P<base>.+)_Changelog\.txt$",
              re.IGNORECASE,
          )

          image_extensions = {
              ".gif",
              ".png",
              ".jpg",
              ".jpeg",
              ".webp",
              ".bmp",
          }

          def fail(message):
              print(
                  f"::error title=NLH release index failure::{message}",
                  flush=True,
              )
              raise SystemExit(1)

          def notice(message):
              print(
                  f"::notice title=NLH release index::{message}",
                  flush=True,
              )

          def version_key(version):
              return tuple(int(part) for part in version.split("."))

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)
              return digest.hexdigest().lower()

          def git_blob_sha(path):
              relative = path.relative_to(root).as_posix()
              result = subprocess.run(
                  ["git", "hash-object", "--", relative],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              value = result.stdout.strip().lower()
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  fail(f"Invalid Git blob SHA for {relative}")
              return value

          def raw_path(path):
              relative = path.relative_to(root).as_posix()
              return "/".join(
                  quote(part, safe="")
                  for part in relative.split("/")
              )

          def clean_field(value):
              value = str(value)
              if "|" in value or "\r" in value or "\n" in value:
                  fail(
                      f"Unsupported character in index field: {value!r}"
                  )
              return value

          def encode_embedded_text(path):
              return (
                  "B64:"
                  + base64.b64encode(path.read_bytes()).decode("ascii")
              )

          def decode_embedded_text(value, name):
              if not value.startswith("B64:") or not value[4:]:
                  fail(
                      f"Embedded text is invalid for {name}."
                  )
              try:
                  return base64.b64decode(
                      value[4:],
                      validate=True,
                  )
              except Exception:
                  fail(
                      f"Embedded text is invalid for {name}."
                  )

          def make_row(
              item_type,
              path,
              version="",
              character="",
              base_name="",
              private_metadata="",
              changelog="",
              sha256_override=None,
              size_override=None,
              name_override=None,
          ):
              fields = [
                  item_type,
                  path.name if name_override is None else name_override,
                  raw_path(path),
                  git_blob_sha(path),
                  (
                      sha256_file(path)
                      if sha256_override is None
                      else sha256_override
                  ),
                  (
                      str(path.stat().st_size)
                      if size_override is None
                      else str(size_override)
                  ),
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ]
              if len(fields) != field_count:
                  fail("Internal index row field-count error.")
              return "|".join(
                  clean_field(field)
                  for field in fields
              )

          def normalize_internal_path(value):
              value = value.replace("\\", "/")
              parsed = PurePosixPath(value)
              if parsed.is_absolute() or ".." in parsed.parts:
                  fail(f"Unsafe ZIP member path: {value}")
              normalized = parsed.as_posix()
              if normalized in ("", "."):
                  fail(f"Invalid ZIP member path: {value}")
              return normalized

          def read_fbmod_members(zip_path):
              members = []
              seen = set()

              try:
                  with zipfile.ZipFile(zip_path, "r") as archive:
                      bad = archive.testzip()
                      if bad is not None:
                          fail(
                              f"ZIP integrity failure for "
                              f"{zip_path.name}: {bad}"
                          )

                      for info in archive.infolist():
                          if info.is_dir():
                              continue

                          internal = normalize_internal_path(
                              info.filename
                          )
                          if not internal.casefold().endswith(".fbmod"):
                              continue

                          key = internal.casefold()
                          if key in seen:
                              fail(
                                  f"Duplicate .fbmod path in "
                                  f"{zip_path.name}: {internal}"
                              )
                          seen.add(key)

                          digest = hashlib.sha256()
                          size = 0

                          with archive.open(info, "r") as stream:
                              for block in iter(
                                  lambda: stream.read(1024 * 1024),
                                  b"",
                              ):
                                  digest.update(block)
                                  size += len(block)

                          if size != info.file_size:
                              fail(
                                  f"Size mismatch for {internal} "
                                  f"in {zip_path.name}"
                              )

                          members.append({
                              "name": PurePosixPath(internal).name,
                              "internal_path": internal,
                              "sha256": digest.hexdigest().lower(),
                              "size": size,
                          })

              except zipfile.BadZipFile:
                  fail(f"Invalid ZIP file: {zip_path.name}")

              members.sort(
                  key=lambda item: item["internal_path"].casefold()
              )

              if not members:
                  fail(
                      f"Mod ZIP contains no .fbmod files: "
                      f"{zip_path.name}"
                  )

              return members

          def generic_type(path):
              suffix = path.suffix.casefold()

              if suffix == ".ico":
                  return "ICON"

              if suffix == ".gif":
                  return "GIF"

              if suffix in image_extensions:
                  return "IMAGE_ASSET"

              if suffix == ".vbs":
                  return "SCRIPT"

              if suffix == ".txt":
                  return "TEXT_ASSET"

              if suffix == ".json":
                  return "DATA_ASSET"

              return "FILE"

          repository_files = sorted(
              (
                  path
                  for path in root.iterdir()
                  if path.is_file() and path.name != index_name
              ),
              key=lambda path: path.name.casefold(),
          )

          files_by_name = {}

          for path in repository_files:
              key = path.name.casefold()
              if key in files_by_name:
                  fail(
                      f"Duplicate case-insensitive filename: "
                      f"{path.name}"
                  )
              files_by_name[key] = path

          managers = []
          releases = []
          release_private_files = []
          profiles = []
          mods = []
          private_files = []
          changelog_files = []
          generic_files = []

          for path in repository_files:
              name = path.name

              if manager_pattern.fullmatch(name):
                  managers.append(path)
                  continue

              match = release_pattern.fullmatch(name)
              if match:
                  releases.append(
                      (path, match.group("version"))
                  )
                  continue

              match = release_private_pattern.fullmatch(name)
              if match:
                  release_private_files.append(
                      (path, match.group("version"))
                  )
                  continue

              if profiles_pattern.fullmatch(name):
                  profiles.append(path)
                  continue

              match = mod_pattern.fullmatch(name)
              if match:
                  mods.append((
                      path,
                      match.group("version"),
                      match.group("character"),
                  ))
                  continue

              match = private_pattern.fullmatch(name)
              if match:
                  private_files.append(
                      (path, match.group("base"))
                  )
                  continue

              match = changelog_pattern.fullmatch(name)
              if match:
                  changelog_files.append(
                      (path, match.group("base"))
                  )
                  continue

              generic_files.append(path)

          if not releases:
              fail("No manager release files were found.")

          rows = []
          expected_mod_files = {}

          for path in managers:
              rows.append(
                  make_row(
                      "MANAGER",
                      path,
                      base_name=path.stem,
                  )
              )

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem
              private_name = f"{base_name}_Private.txt"

              rows.append(make_row(
                  "RELEASE",
                  path,
                  version=version,
                  base_name=base_name,
                  private_metadata=(
                      private_name
                      if private_name.casefold() in files_by_name
                      else ""
                  ),
                  changelog=encode_embedded_text(path),
              ))

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              rows.append(make_row(
                  "RELEASE_PRIVATE",
                  path,
                  version=version,
                  base_name=path.name[:-len("_Private.txt")],
                  changelog=encode_embedded_text(path),
              ))

          for path in profiles:
              rows.append(make_row(
                  "SQUAD_PROFILES",
                  path,
                  base_name=path.stem,
              ))

          mod_base_names = set()

          for path, version, character in sorted(
              mods,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem

              if base_name.casefold() in mod_base_names:
                  fail(f"Duplicate mod base name: {base_name}")

              mod_base_names.add(base_name.casefold())

              private_name = f"{base_name}_Private.txt"
              changelog_name = f"{base_name}_Changelog.txt"

              rows.append(make_row(
                  "MOD",
                  path,
                  version=version,
                  character=character,
                  base_name=base_name,
                  private_metadata=(
                      private_name
                      if private_name.casefold() in files_by_name
                      else ""
                  ),
                  changelog=(
                      changelog_name
                      if changelog_name.casefold() in files_by_name
                      else ""
                  ),
              ))

              members = read_fbmod_members(path)
              expected_mod_files[path.name.casefold()] = members

              for member in members:
                  rows.append(make_row(
                      "#MOD_FILE",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      changelog=member["internal_path"],
                      sha256_override=member["sha256"],
                      size_override=member["size"],
                      name_override=member["name"],
                  ))

          release_private_names = {
              path.name.casefold()
              for path, unused in release_private_files
          }

          for path, base_name in sorted(
              private_files,
              key=lambda item: item[0].name.casefold(),
          ):
              if path.name.casefold() in release_private_names:
                  continue

              rows.append(make_row(
                  "PRIVATE",
                  path,
                  base_name=base_name,
                  changelog=encode_embedded_text(path),
              ))

          for path, base_name in sorted(
              changelog_files,
              key=lambda item: item[0].name.casefold(),
          ):
              rows.append(make_row(
                  "CHANGELOG",
                  path,
                  base_name=base_name,
              ))

          for path in sorted(
              generic_files,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(make_row(
                  generic_type(path),
                  path,
                  base_name=path.stem,
              ))

          output_text = "\n".join([
              signature,
              header,
              *rows,
          ]) + "\n"

          index_path.write_text(
              output_text,
              encoding="utf-8",
              newline="\n",
          )

          final_lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if final_lines[:2] != [signature, header]:
              fail("The regenerated index header is invalid.")

          repository_names = set()
          repository_paths = set()
          mod_file_keys = set()
          mod_file_paths = {}
          embedded_text_names = set()

          for line_number, line in enumerate(
              final_lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != field_count:
                  fail(
                      f"Index line {line_number} has "
                      f"the wrong field count."
                  )

              (
                  item_type,
                  name,
                  stored_raw_path,
                  stored_blob_sha,
                  stored_sha256,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              decoded = "/".join(
                  unquote(part)
                  for part in stored_raw_path.split("/")
              )
              path = root / decoded

              if not path.is_file():
                  fail(
                      f"Indexed file does not exist: {decoded}"
                  )

              if stored_raw_path != raw_path(path):
                  fail(
                      f"RAW_PATH mismatch on line {line_number}"
                  )

              if stored_blob_sha != git_blob_sha(path):
                  fail(
                      f"Git blob SHA mismatch on line {line_number}"
                  )

              if not re.fullmatch(
                  r"[0-9a-f]{64}",
                  stored_sha256,
              ):
                  fail(
                      f"Invalid SHA-256 on line {line_number}"
                  )

              if not stored_size.isdigit():
                  fail(
                      f"Invalid size on line {line_number}"
                  )

              if item_type == "#MOD_FILE":
                  internal = normalize_internal_path(changelog)
                  key = (
                      stored_raw_path.casefold(),
                      internal.casefold(),
                  )

                  if key in mod_file_keys:
                      fail(
                          f"Duplicate MOD_FILE record on "
                          f"line {line_number}"
                      )

                  mod_file_keys.add(key)
                  found = None

                  with zipfile.ZipFile(path, "r") as archive:
                      for info in archive.infolist():
                          if info.is_dir():
                              continue

                          candidate = normalize_internal_path(
                              info.filename
                          )

                          if candidate.casefold() == internal.casefold():
                              if found is not None:
                                  fail(
                                      f"Duplicate ZIP member: {internal}"
                                  )
                              found = info

                      if found is None:
                          fail(
                              f"Missing MOD_FILE member: "
                              f"{path.name} -> {internal}"
                          )

                      digest = hashlib.sha256()
                      actual_size = 0

                      with archive.open(found, "r") as stream:
                          for block in iter(
                              lambda: stream.read(1024 * 1024),
                              b"",
                          ):
                              digest.update(block)
                              actual_size += len(block)

                  if digest.hexdigest().lower() != stored_sha256:
                      fail(
                          f"MOD_FILE SHA-256 mismatch: "
                          f"{path.name} -> {internal}"
                      )

                  if str(actual_size) != stored_size:
                      fail(
                          f"MOD_FILE size mismatch: "
                          f"{path.name} -> {internal}"
                      )

                  mod_file_paths.setdefault(
                      path.name.casefold(),
                      set(),
                  ).add(internal.casefold())

                  continue

              if path.name != name:
                  fail(
                      f"NAME and RAW_PATH disagree on "
                      f"line {line_number}"
                  )

              if stored_sha256 != sha256_file(path):
                  fail(f"SHA-256 mismatch for {name}")

              if stored_size != str(path.stat().st_size):
                  fail(f"Size mismatch for {name}")

              if name.casefold() in repository_names:
                  fail(
                      f"Duplicate repository NAME: {name}"
                  )

              if stored_raw_path.casefold() in repository_paths:
                  fail(
                      f"Duplicate repository RAW_PATH: "
                      f"{stored_raw_path}"
                  )

              repository_names.add(name.casefold())
              repository_paths.add(
                  stored_raw_path.casefold()
              )

              if item_type in {
                  "PRIVATE",
                  "RELEASE_PRIVATE",
                  "RELEASE",
              }:
                  if (
                      decode_embedded_text(changelog, name)
                      != path.read_bytes()
                  ):
                      fail(
                          f"Embedded text mismatch "
                          f"for {name}"
                      )

                  embedded_text_names.add(name.casefold())

          for parent, members in expected_mod_files.items():
              expected = {
                  item["internal_path"].casefold()
                  for item in members
              }

              if mod_file_paths.get(parent, set()) != expected:
                  fail(
                      f"MOD_FILE set mismatch for {parent}"
                  )

          expected_repository_names = {
              path.name.casefold()
              for path in repository_files
          }

          if repository_names != expected_repository_names:
              missing = sorted(
                  expected_repository_names - repository_names
              )
              extra = sorted(
                  repository_names - expected_repository_names
              )
              fail(
                  f"Repository-file coverage mismatch. "
                  f"Missing={missing}; extra={extra}"
              )

          expected_embedded_text_names = {
              path.name.casefold()
              for path, unused in release_private_files
          }
          expected_embedded_text_names.update(
              path.name.casefold()
              for path, unused in private_files
          )
          expected_embedded_text_names.update(
              path.name.casefold()
              for path, unused in releases
          )

          if embedded_text_names != expected_embedded_text_names:
              missing = sorted(
                  expected_embedded_text_names - embedded_text_names
              )
              extra = sorted(
                  embedded_text_names - expected_embedded_text_names
              )
              fail(
                  "Embedded text coverage mismatch. "
                  f"Missing={missing}; extra={extra}"
              )

          counts = {}

          for row in rows:
              item_type = row.split("|", 1)[0]
              counts[item_type] = (
                  counts.get(item_type, 0) + 1
              )

          print(
              f"Regenerated {index_name} "
              f"with {len(rows)} records."
          )

          for item_type in sorted(counts):
              print(f"{item_type}: {counts[item_type]}")

          notice(
              "The complete generic Version 1 index and "
              "contained MOD_FILE rows were rebuilt and verified."
          )
          PY

      - name: Display regenerated release index summary
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail
          echo "File: $INDEX_FILE"
          echo "Lines: $(wc -l < "$INDEX_FILE")"
          echo "Bytes: $(wc -c < "$INDEX_FILE")"
          awk -F'|' 'NR > 2 { counts[$1]++ } END { for (type in counts) print type ": " counts[type] }' "$INDEX_FILE" | sort

      - name: Commit and push regenerated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail
          git status --short

          if [ -z "$(git status --porcelain -- "$INDEX_FILE")" ]; then
            echo "Release index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          if git diff --cached --quiet; then
            echo "No staged release-index changes."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Update NLH Mod Manager release index"

          if git push origin HEAD:main; then
            exit 0
          fi

          git pull --rebase origin main
          git push origin HEAD:main
