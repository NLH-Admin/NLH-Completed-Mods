name: Rebuild NLH Repository Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "NLH Repository Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-repository-index-main
  cancel-in-progress: false

jobs:
  rebuild-index:
    name: Rebuild NLH repository index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and verify repository index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote, unquote

          root = Path.cwd().resolve()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          signature = "NLH-REPOSITORY-INDEX|1"

          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          manager_name = "NLH Mod Manager.vbs"
          squad_profiles_name = "NLH Mod Manager Squad Profiles.txt"
          icon_name = "NLH_MM.ico"

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>[1-9]\d*\.\d+)\.vbs$",
              re.IGNORECASE,
          )

          release_private_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>[1-9]\d*\.\d+)_Private\.txt$",
              re.IGNORECASE,
          )

          mod_pattern = re.compile(
              r"^(?P<character>.+)_"
              r"(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )

          def fail(message):
              print(
                  f"::error title=NLH repository index failure::{message}"
              )
              raise SystemExit(1)

          def relative(path):
              return path.resolve().relative_to(root)

          def encoded_path(path):
              return "/".join(
                  quote(part, safe="")
                  for part in relative(path).as_posix().split("/")
              )

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def blob_sha(path):
              result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      relative(path).as_posix(),
                  ],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              value = result.stdout.strip().lower()

              if not re.fullmatch(
                  r"[0-9a-f]{40}",
                  value,
              ):
                  fail(
                      "Invalid Git blob SHA for "
                      f"{relative(path).as_posix()}"
                  )

              return value

          def clean(value):
              return (
                  str(value)
                  .replace("|", "")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          def make_row(
              item_type,
              path,
              version="",
              character="",
              base_name="",
              private_metadata="",
              changelog="",
          ):
              fields = [
                  item_type,
                  path.name,
                  encoded_path(path),
                  blob_sha(path),
                  sha256_file(path),
                  str(path.stat().st_size),
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ]

              return "|".join(
                  clean(field)
                  for field in fields
              )

          def version_key(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )

          def ignored(path):
              rel = relative(path)

              if ".git" in rel.parts:
                  return True

              if rel.as_posix() == index_name:
                  return True

              if (
                  len(rel.parts) >= 2
                  and rel.parts[0] == ".github"
                  and rel.parts[1] == "workflows"
              ):
                  return True

              return False

          files = sorted(
              (
                  path
                  for path in root.rglob("*")
                  if path.is_file()
                  and not ignored(path)
              ),
              key=lambda path: (
                  relative(path)
                  .as_posix()
                  .casefold()
              ),
          )

          if not files:
              fail("No repository files were found.")

          by_name = {}

          for path in files:
              key = path.name.casefold()

              if key in by_name:
                  fail(
                      "Duplicate filename in different paths: "
                      f"{relative(by_name[key]).as_posix()} and "
                      f"{relative(path).as_posix()}"
                  )

              by_name[key] = path

          manager = by_name.get(
              manager_name.casefold()
          )

          if manager is None:
              fail(
                  f"Required launcher is missing: {manager_name}"
              )

          releases = []
          release_private_files = []
          squad_profiles = []
          icons = []
          mods = []
          private_files = []

          for path in files:
              if path == manager:
                  continue

              name = path.name

              match = release_pattern.fullmatch(name)

              if match:
                  releases.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              match = release_private_pattern.fullmatch(
                  name
              )

              if match:
                  release_private_files.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              if (
                  name.casefold()
                  == squad_profiles_name.casefold()
              ):
                  squad_profiles.append(path)
                  continue

              if name.casefold() == icon_name.casefold():
                  icons.append(path)
                  continue

              match = mod_pattern.fullmatch(name)

              if match:
                  mods.append(
                      (
                          path,
                          match.group("version"),
                          match.group("character"),
                      )
                  )
                  continue

              if name.casefold().endswith(
                  "_private.txt"
              ):
                  private_files.append(path)

          release_by_version = {}

          for path, version in releases:
              if version in release_by_version:
                  fail(
                      "Duplicate public manager release "
                      f"V{version}"
                  )

              release_by_version[version] = path

          required_releases = {
              "1.0": (
                  "NLH Mod Manager Public Release "
                  "V1.0.vbs"
              ),
              "1.1": (
                  "NLH Mod Manager Public Release "
                  "V1.1.vbs"
              ),
          }

          for version, expected_name in (
              required_releases.items()
          ):
              path = release_by_version.get(version)

              if path is None:
                  fail(
                      "Required release is missing: "
                      f"{expected_name}"
                  )

              if path.name != expected_name:
                  fail(
                      f"Release V{version} must be "
                      f"named exactly: {expected_name}"
                  )

          rows = [
              make_row(
                  "MANAGER",
                  manager,
                  base_name=manager.stem,
              )
          ]

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem
              private_name = (
                  f"{base_name}_Private.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold() in by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "RELEASE",
                      path,
                      version=version,
                      base_name=base_name,
                      private_metadata=private_metadata,
                  )
              )

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              rows.append(
                  make_row(
                      "RELEASE_PRIVATE",
                      path,
                      version=version,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          for path in sorted(
              squad_profiles,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "SQUAD_PROFILES",
                      path,
                      base_name=path.stem,
                  )
              )

          for path in sorted(
              icons,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "ICON",
                      path,
                      base_name=path.stem,
                  )
              )

          for path, version, character in sorted(
              mods,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              changelog_name = (
                  f"{base_name}_Changelog.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold() in by_name
                  else ""
              )

              changelog = (
                  changelog_name
                  if changelog_name.casefold() in by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "MOD",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      private_metadata=private_metadata,
                      changelog=changelog,
                  )
              )

          release_private_names = {
              path.name.casefold()
              for path, unused_version
              in release_private_files
          }

          for path in sorted(
              private_files,
              key=lambda item: item.name.casefold(),
          ):
              if (
                  path.name.casefold()
                  in release_private_names
              ):
                  continue

              rows.append(
                  make_row(
                      "PRIVATE",
                      path,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          index_text = (
              "\n".join(
                  [
                      signature,
                      header,
                      *rows,
                  ]
              )
              + "\n"
          )

          index_path.write_text(
              index_text,
              encoding="utf-8",
              newline="\n",
          )

          lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if (
              len(lines) < 2
              or lines[0] != signature
              or lines[1] != header
          ):
              fail(
                  "Generated index signature "
                  "or header is invalid."
              )

          records = {}
          raw_paths = set()

          for line_number, line in enumerate(
              lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  fail(
                      f"Line {line_number} has "
                      f"{len(fields)} fields instead of 11."
                  )

              (
                  item_type,
                  name,
                  raw_path,
                  stored_blob,
                  stored_hash,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              decoded = "/".join(
                  unquote(part)
                  for part in raw_path.split("/")
              )

              path = (root / decoded).resolve()

              try:
                  path.relative_to(root)
              except ValueError:
                  fail(
                      f"Line {line_number} points outside "
                      f"the repository: {raw_path}"
                  )

              if not path.is_file():
                  fail(
                      "Indexed file does not exist: "
                      f"{decoded}"
                  )

              if path.name != name:
                  fail(
                      "NAME and RAW_PATH disagree on "
                      f"line {line_number}: {name}"
                  )

              if raw_path != encoded_path(path):
                  fail(
                      f"RAW_PATH mismatch for {name}"
                  )

              if (
                  stored_blob.lower()
                  != blob_sha(path)
              ):
                  fail(
                      f"Git blob SHA mismatch for {name}"
                  )

              if (
                  stored_hash.lower()
                  != sha256_file(path)
              ):
                  fail(
                      f"SHA-256 mismatch for {name}"
                  )

              if (
                  stored_size
                  != str(path.stat().st_size)
              ):
                  fail(
                      f"Size mismatch for {name}"
                  )

              key = name.casefold()
              raw_key = raw_path.casefold()

              if key in records:
                  fail(
                      "Duplicate NAME in generated "
                      f"index: {name}"
                  )

              if raw_key in raw_paths:
                  fail(
                      "Duplicate RAW_PATH in generated "
                      f"index: {raw_path}"
                  )

              records[key] = fields
              raw_paths.add(raw_key)

          required_records = [
              (
                  "MANAGER",
                  manager_name,
                  "",
              ),
              (
                  "RELEASE",
                  required_releases["1.0"],
                  "1.0",
              ),
              (
                  "RELEASE",
                  required_releases["1.1"],
                  "1.1",
              ),
          ]

          for (
              expected_type,
              name,
              expected_version,
          ) in required_records:
              record = records.get(
                  name.casefold()
              )

              if record is None:
                  fail(
                      "Required file is absent from "
                      f"generated index: {name}"
                  )

              if record[0] != expected_type:
                  fail(
                      f"Incorrect TYPE for {name}: "
                      f"{record[0]}"
                  )

              if (
                  expected_version
                  and record[6] != expected_version
              ):
                  fail(
                      f"Incorrect VERSION for {name}: "
                      f"{record[6]}"
                  )

          v11_name = required_releases["1.1"]

          v11_private_name = (
              "NLH Mod Manager Public Release "
              "V1.1_Private.txt"
          )

          v11_record = records[
              v11_name.casefold()
          ]

          v11_private_record = records.get(
              v11_private_name.casefold()
          )

          if v11_private_record is not None:
              if (
                  v11_record[9]
                  != v11_private_name
              ):
                  fail(
                      "V1.1 RELEASE does not reference "
                      "its private metadata file."
                  )

              if (
                  v11_private_record[0]
                  != "RELEASE_PRIVATE"
              ):
                  fail(
                      "V1.1 private metadata has "
                      "the wrong TYPE."
                  )

              if v11_private_record[6] != "1.1":
                  fail(
                      "V1.1 private metadata has "
                      "the wrong VERSION."
                  )

          elif v11_recordfail(
                  "V1.1 RELEASE references private "
                  "metadata that is not indexed."
              )

          print(
              f"Generated {index_name} "
              f"with {len(rows)} records."
          )

          for version in ("1.0", "1.1"):
              record = records[
                  required_releases[
                      version
                  ].casefold()
              ]

              print(
                  f"V{version}: "
                  f"size={record[5]} "
                  f"sha256={record[4]} "
                  f"blob={record[3]}"
              )

          print(
              "Repository index verification "
              "completed successfully."
          )
          PY

      - name: Display generated index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          cat -- "$INDEX_FILE"

      - name: Commit updated index
        shell: bash
        env:
          INDEX_FILE: NLH Repository Index.txt
        run: |
          set -euo pipefail

          if git diff --quiet -- "$INDEX_FILE"; then
            echo "Repository index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          git commit \
            -m "Update NLH repository index"

          git push \
            origin \
            HEAD:main
