name: Update NLH Mod Manager Release Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "NLH Mod Manager Release Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  update-release-index:
    name: Update NLH Mod Manager release index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild and verify complete release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import quote, unquote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          signature = "NLH-REPOSITORY-INDEX|1"
          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )
          field_count = 11

          manager_name = "NLH Mod Manager.vbs"
          profiles_name = "NLH Mod Manager Squad Profiles.txt"
          icon_name = "NLH_MM.ico"

          release_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)\.vbs$",
              re.IGNORECASE,
          )

          release_private_pattern = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)_Private\.txt$",
              re.IGNORECASE,
          )

          mod_pattern = re.compile(
              r"^(?P<character>.+)_"
              r"(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )

          private_pattern = re.compile(
              r"^(?P<base>.+)_Private\.txt$",
              re.IGNORECASE,
          )

          changelog_pattern = re.compile(
              r"^(?P<base>.+)_Changelog\.txt$",
              re.IGNORECASE,
          )

          def fail(message):
              print(
                  f"::error title=NLH release index failure::{message}",
                  flush=True,
              )
              raise SystemExit(1)

          def notice(message):
              print(
                  f"::notice title=NLH release index::{message}",
                  flush=True,
              )

          def version_key(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def git_blob_sha(path):
              relative = path.relative_to(root).as_posix()

              result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      relative,
                  ],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              value = result.stdout.strip().lower()

              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  fail(
                      f"Invalid Git blob SHA for {relative}"
                  )

              return value

          def raw_path(path):
              relative = path.relative_to(root).as_posix()

              return "/".join(
                  quote(part, safe="")
                  for part in relative.split("/")
              )

          def clean_field(value):
              value = str(value)

              if (
                  "|" in value
                  or "\r" in value
                  or "\n" in value
              ):
                  fail(
                      "An index field contains an unsupported "
                      f"character: {value!r}"
                  )

              return value

          def build_row(fields):
              if len(fields) != field_count:
                  fail(
                      "Internal index row field-count error: "
                      f"expected {field_count}, got {len(fields)}."
                  )

              return "|".join(
                  clean_field(field)
                  for field in fields
              )

          def make_file_row(
              item_type,
              path,
              version="",
              character="",
              base_name="",
              private_metadata="",
              changelog="",
          ):
              return build_row(
                  [
                      item_type,
                      path.name,
                      raw_path(path),
                      git_blob_sha(path),
                      sha256_file(path),
                      str(path.stat().st_size),
                      version,
                      character,
                      base_name,
                      private_metadata,
                      changelog,
                  ]
              )

          def normalize_internal_path(value):
              value = str(value).replace("\\", "/")

              while value.startswith("./"):
                  value = value[2:]

              parsed = PurePosixPath(value)

              if (
                  not value
                  or value.startswith("/")
                  or parsed.is_absolute()
                  or ".." in parsed.parts
              ):
                  fail(
                      f"Unsafe ZIP member path: {value!r}"
                  )

              normalized = parsed.as_posix()

              if normalized in ("", "."):
                  fail(
                      f"Invalid ZIP member path: {value!r}"
                  )

              return normalized

          def hash_zip_member(archive, info):
              digest = hashlib.sha256()
              size = 0

              with archive.open(info, "r") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)
                      size += len(block)

              if size != info.file_size:
                  fail(
                      "Uncompressed size mismatch for "
                      f"{info.filename}."
                  )

              return digest.hexdigest().lower(), size

          def read_fbmod_members(zip_path):
              members = []
              seen_internal_paths = set()
              seen_filenames = set()

              try:
                  with zipfile.ZipFile(zip_path, "r") as archive:
                      bad_member = archive.testzip()

                      if bad_member is not None:
                          fail(
                              "ZIP integrity verification failed for "
                              f"{zip_path.name}: {bad_member}"
                          )

                      for info in archive.infolist():
                          if info.is_dir():
                              continue

                          internal_path = normalize_internal_path(
                              info.filename
                          )

                          if not internal_path.casefold().endswith(
                              ".fbmod"
                          ):
                              continue

                          internal_key = internal_path.casefold()
                          filename = PurePosixPath(
                              internal_path
                          ).name
                          filename_key = filename.casefold()

                          if internal_key in seen_internal_paths:
                              fail(
                                  "Duplicate case-insensitive .fbmod "
                                  f"path in {zip_path.name}: "
                                  f"{internal_path}"
                              )

                          if filename_key in seen_filenames:
                              fail(
                                  "Duplicate case-insensitive .fbmod "
                                  f"filename in {zip_path.name}: "
                                  f"{filename}"
                              )

                          seen_internal_paths.add(internal_key)
                          seen_filenames.add(filename_key)

                          sha256, size = hash_zip_member(
                              archive,
                              info,
                          )

                          members.append(
                              {
                                  "name": filename,
                                  "internal_path": internal_path,
                                  "sha256": sha256,
                                  "size": size,
                              }
                          )

              except zipfile.BadZipFile:
                  fail(
                      f"Invalid ZIP file: {zip_path.name}"
                  )

              members.sort(
                  key=lambda item:
                      item["internal_path"].casefold()
              )

              if not members:
                  fail(
                      "Mod ZIP contains no .fbmod files: "
                      f"{zip_path.name}"
                  )

              return members

          repository_files = sorted(
              (
                  path
                  for path in root.iterdir()
                  if path.is_file()
                  and path.name != index_name
              ),
              key=lambda path: path.name.casefold(),
          )

          files_by_name = {}

          for path in repository_files:
              key = path.name.casefold()

              if key in files_by_name:
                  fail(
                      "Duplicate case-insensitive filename: "
                      f"{path.name}"
                  )

              files_by_name[key] = path

          manager_file = files_by_name.get(
              manager_name.casefold()
          )

          releases = []
          release_private_files = []
          profiles = []
          icons = []
          mods = []
          private_files = []
          changelog_files = []
          ignored_files = []

          for path in repository_files:
              name = path.name

              if (
                  manager_file is not None
                  and path == manager_file
              ):
                  continue

              match = release_pattern.fullmatch(name)

              if match:
                  releases.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              match = release_private_pattern.fullmatch(name)

              if match:
                  release_private_files.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              if name.casefold() == profiles_name.casefold():
                  profiles.append(path)
                  continue

              if name.casefold() == icon_name.casefold():
                  icons.append(path)
                  continue

              match = mod_pattern.fullmatch(name)

              if match:
                  mods.append(
                      (
                          path,
                          match.group("version"),
                          match.group("character"),
                      )
                  )
                  continue

              match = private_pattern.fullmatch(name)

              if match:
                  private_files.append(
                      (
                          path,
                          match.group("base"),
                      )
                  )
                  continue

              match = changelog_pattern.fullmatch(name)

              if match:
                  changelog_files.append(
                      (
                          path,
                          match.group("base"),
                      )
                  )
                  continue

              ignored_files.append(path)

          releases_by_version = {}

          for path, version in releases:
              if version in releases_by_version:
                  fail(
                      "Duplicate manager release version "
                      f"V{version}: "
                      f"{releases_by_version[version].name} "
                      f"and {path.name}"
                  )

              releases_by_version[version] = path

          release_private_by_version = {}

          for path, version in release_private_files:
              if version in release_private_by_version:
                  fail(
                      "Duplicate manager private metadata "
                      f"version V{version}: "
                      f"{release_private_by_version[version].name} "
                      f"and {path.name}"
                  )

              release_private_by_version[version] = path

          if not releases:
              fail(
                  "No manager release files were found. "
                  "At least one file named "
                  "NLH Mod Manager Public Release "
                  "V<version>.vbs is required."
              )

          rows = []
          expected_mod_files = {}

          if manager_file is not None:
              rows.append(
                  make_file_row(
                      "MANAGER",
                      manager_file,
                      base_name=manager_file.stem,
                  )
              )

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem
              private_name = (
                  f"{base_name}_Private.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold()
                  in files_by_name
                  else ""
              )

              rows.append(
                  make_file_row(
                      "RELEASE",
                      path,
                      version=version,
                      base_name=base_name,
                      private_metadata=private_metadata,
                  )
              )

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              rows.append(
                  make_file_row(
                      "RELEASE_PRIVATE",
                      path,
                      version=version,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          for path in sorted(
              profiles,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_file_row(
                      "SQUAD_PROFILES",
                      path,
                      base_name=path.stem,
                  )
              )

          for path in sorted(
              icons,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_file_row(
                      "ICON",
                      path,
                      base_name=path.stem,
                  )
              )

          mod_base_names = set()
          global_character_file_keys = set()

          for path, version, character in sorted(
              mods,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem
              base_key = base_name.casefold()

              if base_key in mod_base_names:
                  fail(
                      f"Duplicate mod base name: {base_name}"
                  )

              mod_base_names.add(base_key)

              private_name = (
                  f"{base_name}_Private.txt"
              )

              changelog_name = (
                  f"{base_name}_Changelog.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold()
                  in files_by_name
                  else ""
              )

              changelog = (
                  changelog_name
                  if changelog_name.casefold()
                  in files_by_name
                  else ""
              )

              rows.append(
                  make_file_row(
                      "MOD",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      private_metadata=private_metadata,
                      changelog=changelog,
                  )
              )

              members = read_fbmod_members(path)

              expected_mod_files[
                  path.name.casefold()
              ] = members

              for member in members:
                  global_key = (
                      character.casefold(),
                      member["name"].casefold(),
                  )

                  if global_key in global_character_file_keys:
                      fail(
                          "The same case-insensitive .fbmod "
                          "filename is used by multiple versions "
                          f"of {character}: {member['name']}"
                      )

                  global_character_file_keys.add(global_key)

                  rows.append(
                      build_row(
                          [
                              "MOD_FILE",
                              member["name"],
                              raw_path(path),
                              git_blob_sha(path),
                              member["sha256"],
                              str(member["size"]),
                              version,
                              character,
                              base_name,
                              "",
                              member["internal_path"],
                          ]
                      )
                  )

          release_private_names = {
              path.name.casefold()
              for path, unused_version
              in release_private_files
          }

          for path, base_name in sorted(
              private_files,
              key=lambda item:
                  item[0].name.casefold(),
          ):
              if (
                  path.name.casefold()
                  in release_private_names
              ):
                  continue

              rows.append(
                  make_file_row(
                      "PRIVATE",
                      path,
                      base_name=base_name,
                  )
              )

          for path, base_name in sorted(
              changelog_files,
              key=lambda item:
                  item[0].name.casefold(),
          ):
              rows.append(
                  make_file_row(
                      "CHANGELOG",
                      path,
                      base_name=base_name,
                  )
              )

          output_text = (
              "\n".join(
                  [
                      signature,
                      header,
                      *rows,
                  ]
              )
              + "\n"
          )

          index_path.write_text(
              output_text,
              encoding="utf-8",
              newline="\n",
          )

          final_lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if len(final_lines) < 3:
              fail(
                  "The regenerated index is incomplete."
              )

          if final_lines[0] != signature:
              fail(
                  "The regenerated index signature "
                  "is invalid."
              )

          if final_lines[1] != header:
              fail(
                  "The regenerated index header "
                  "is invalid."
              )

          indexed_names = set()
          indexed_paths = set()
          indexed_mod_files = set()
          verified_release_versions = set()
          verified_private_versions = set()
          verified_mod_files = {}

          for line_number, line in enumerate(
              final_lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != field_count:
                  fail(
                      f"Index line {line_number} has "
                      f"{len(fields)} fields instead of "
                      f"{field_count}."
                  )

              (
                  item_type,
                  name,
                  stored_raw_path,
                  stored_blob_sha,
                  stored_sha256,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              decoded_relative = "/".join(
                  unquote(part)
                  for part
                  in stored_raw_path.split("/")
              )

              path = root / decoded_relative

              if not path.is_file():
                  fail(
                      "Indexed file does not exist: "
                      f"{decoded_relative}"
                  )

              if stored_raw_path != raw_path(path):
                  fail(
                      f"RAW_PATH mismatch on line "
                      f"{line_number}."
                  )

              if stored_blob_sha != git_blob_sha(path):
                  fail(
                      f"Git blob SHA mismatch on line "
                      f"{line_number}."
                  )

              if not re.fullmatch(
                  r"[0-9a-f]{64}",
                  stored_sha256,
              ):
                  fail(
                      f"Invalid SHA-256 on line "
                      f"{line_number}."
                  )

              if not stored_size.isdigit():
                  fail(
                      f"Invalid size on line "
                      f"{line_number}."
                  )

              if item_type == "MOD_FILE":
                  parent_key = path.name.casefold()

                  if parent_key not in expected_mod_files:
                      fail(
                          "MOD_FILE references an unknown "
                          f"parent ZIP: {path.name}"
                      )

                  internal_path = normalize_internal_path(
                      changelog
                  )

                  expected_members = {
                      (
                          member["name"].casefold(),
                          member["internal_path"].casefold(),
                      ): member
                      for member in expected_mod_files[
                          parent_key
                      ]
                  }

                  member_key = (
                      name.casefold(),
                      internal_path.casefold(),
                  )

                  if member_key not in expected_members:
                      fail(
                          "MOD_FILE does not match a current "
                          f"ZIP member: {name} in {path.name}"
                      )

                  expected = expected_members[member_key]

                  if stored_sha256 != expected["sha256"]:
                      fail(
                          "MOD_FILE SHA-256 mismatch for "
                          f"{name}."
                      )

                  if stored_size != str(expected["size"]):
                      fail(
                          "MOD_FILE size mismatch for "
                          f"{name}."
                      )

                  if private_metadata:
                      fail(
                          "MOD_FILE PRIVATE_METADATA must "
                          f"be empty: {name}"
                      )

                  unique_mod_file_key = (
                      parent_key,
                      member_key,
                  )

                  if unique_mod_file_key in indexed_mod_files:
                      fail(
                          "Duplicate MOD_FILE record for "
                          f"{name} in {path.name}."
                      )

                  indexed_mod_files.add(
                      unique_mod_file_key
                  )

                  verified_mod_files.setdefault(
                      parent_key,
                      set(),
                  ).add(member_key)

                  continue

              if path.name != name:
                  fail(
                      "NAME and RAW_PATH disagree "
                      f"on line {line_number}."
                  )

              if stored_sha256 != sha256_file(path):
                  fail(
                      f"SHA-256 mismatch for {name}."
                  )

              if stored_size != str(
                  path.stat().st_size
              ):
                  fail(
                      f"Size mismatch for {name}."
                  )

              name_key = name.casefold()
              path_key = stored_raw_path.casefold()

              if name_key in indexed_names:
                  fail(
                      "Duplicate NAME in regenerated "
                      f"index: {name}"
                  )

              if path_key in indexed_paths:
                  fail(
                      "Duplicate RAW_PATH in regenerated "
                      f"index: {stored_raw_path}"
                  )

              indexed_names.add(name_key)
              indexed_paths.add(path_key)

              if item_type == "RELEASE":
                  match = release_pattern.fullmatch(name)

                  if not match:
                      fail(
                          f"Malformed RELEASE record: {name}"
                      )

                  detected_version = match.group(
                      "version"
                  )

                  if version != detected_version:
                      fail(
                          f"VERSION mismatch for {name}."
                      )

                  expected_private_name = (
                      f"{path.stem}_Private.txt"
                  )

                  expected_private_value = (
                      expected_private_name
                      if expected_private_name.casefold()
                      in files_by_name
                      else ""
                  )

                  if (
                      private_metadata
                      != expected_private_value
                  ):
                      fail(
                          "PRIVATE_METADATA mismatch "
                          f"for {name}."
                      )

                  verified_release_versions.add(
                      detected_version
                  )

              elif item_type == "RELEASE_PRIVATE":
                  match = (
                      release_private_pattern.fullmatch(
                          name
                      )
                  )

                  if not match:
                      fail(
                          "Malformed RELEASE_PRIVATE "
                          f"record: {name}"
                      )

                  detected_version = match.group(
                      "version"
                  )

                  if version != detected_version:
                      fail(
                          f"VERSION mismatch for {name}."
                      )

                  verified_private_versions.add(
                      detected_version
                  )

              elif item_type == "MOD":
                  match = mod_pattern.fullmatch(name)

                  if not match:
                      fail(
                          f"Malformed MOD record: {name}"
                      )

                  if version != match.group("version"):
                      fail(
                          f"VERSION mismatch for {name}."
                      )

                  if character != match.group("character"):
                      fail(
                          f"CHARACTER mismatch for {name}."
                      )

                  if base_name != path.stem:
                      fail(
                          f"BASE_NAME mismatch for {name}."
                      )

                  expected_private_name = (
                      f"{path.stem}_Private.txt"
                  )

                  expected_changelog_name = (
                      f"{path.stem}_Changelog.txt"
                  )

                  expected_private_value = (
                      expected_private_name
                      if expected_private_name.casefold()
                      in files_by_name
                      else ""
                  )

                  expected_changelog_value = (
                      expected_changelog_name
                      if expected_changelog_name.casefold()
                      in files_by_name
                      else ""
                  )

                  if (
                      private_metadata
                      != expected_private_value
                  ):
                      fail(
                          "PRIVATE_METADATA mismatch "
                          f"for {name}."
                      )

                  if changelog != expected_changelog_value:
                      fail(
                          f"CHANGELOG mismatch for {name}."
                      )

          expected_release_versions = set(
              releases_by_version
          )

          expected_private_versions = set(
              release_private_by_version
          )

          if (
              verified_release_versions
              != expected_release_versions
          ):
              fail(
                  "The regenerated RELEASE version "
                  "set does not match the repository."
              )

          if (
              verified_private_versions
              != expected_private_versions
          ):
              fail(
                  "The regenerated RELEASE_PRIVATE "
                  "version set does not match the "
                  "repository."
              )

          for parent_key, expected_members in (
              expected_mod_files.items()
          ):
              expected_keys = {
                  (
                      member["name"].casefold(),
                      member["internal_path"].casefold(),
                  )
                  for member in expected_members
              }

              actual_keys = verified_mod_files.get(
                  parent_key,
                  set(),
              )

              if actual_keys != expected_keys:
                  fail(
                      "The MOD_FILE rows do not exactly "
                      "match the current contents of "
                      f"{parent_key}."
                  )

          indexed_types = {}

          for line in final_lines[2:]:
              item_type = line.split("|", 1)[0]

              indexed_types[item_type] = (
                  indexed_types.get(
                      item_type,
                      0,
                  )
                  + 1
              )

          print(
              f"Regenerated {index_name} from the "
              "current repository with "
              f"{len(rows)} records."
          )

          for item_type in sorted(indexed_types):
              print(
                  f"{item_type}: "
                  f"{indexed_types[item_type]}"
              )

          for version in sorted(
              releases_by_version,
              key=version_key,
          ):
              path = releases_by_version[version]

              print(
                  f"V{version}: "
                  f"size={path.stat().st_size} "
                  f"sha256={sha256_file(path)} "
                  f"blob={git_blob_sha(path)}"
              )

          for path, unused_version, unused_character in sorted(
              mods,
              key=lambda item: item[0].name.casefold(),
          ):
              count = len(
                  expected_mod_files[
                      path.name.casefold()
                  ]
              )

              print(
                  f"{path.name}: "
                  f"{count} required .fbmod component(s)"
              )

          if ignored_files:
              print(
                  "Files intentionally not indexed:"
              )

              for path in ignored_files:
                  print(f"- {path.name}")

          notice(
              "The Version 1 release index and contained "
              "MOD_FILE rows were rebuilt and verified."
          )
          PY

      - name: Display regenerated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Regenerated release index:"
          echo
          cat -- "$INDEX_FILE"

      - name: Commit and push regenerated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          echo "Git status before staging:"
          git status --short

          if [ -z "$(git status --porcelain -- "$INDEX_FILE")" ]; then
            echo "Release index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          if git diff --cached --quiet; then
            echo "No staged release-index changes."
            exit 0
          fi

          echo "Staged release-index change:"
          git diff --cached --stat

          git commit \
            -m "Update NLH Mod Manager release index"

          if git push origin HEAD:main; then
            echo "Release index pushed successfully."
            exit 0
          fi

          echo "Initial push was rejected."
          echo "Rebasing onto the latest main branch."

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main

          echo "Release index pushed successfully after rebasing."
