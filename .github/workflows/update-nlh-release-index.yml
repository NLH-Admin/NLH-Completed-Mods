name: Rebuild NLH Mod Manager Release Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "NLH Mod Manager Release Index.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlh-manager-release-index-main
  cancel-in-progress: false

jobs:
  rebuild-index:
    name: Rebuild NLH Mod Manager release index
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and verify release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          root = Path.cwd()
          index_name = os.environ["INDEX_FILE"]
          index_path = root / index_name

          signature = "NLH-REPOSITORY-INDEX|1"

          header = (
              "#TYPE|NAME|RAW_PATH|GIT_BLOB_SHA|SHA256|SIZE|VERSION|"
              "CHARACTER|BASE_NAME|PRIVATE_METADATA|CHANGELOG"
          )

          release_re = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)\.vbs$",
              re.IGNORECASE,
          )

          release_private_re = re.compile(
              r"^NLH Mod Manager Public Release "
              r"V(?P<version>\d+(?:\.\d+)*)_Private\.txt$",
              re.IGNORECASE,
          )

          mod_re = re.compile(
              r"^(?P<character>.+)_"
              r"(?P<version>\d+(?:\.\d+)*)\.zip$",
              re.IGNORECASE,
          )

          def fail(message):
              print(
                  f"::error title=NLH release index failure::{message}",
                  flush=True,
              )
              raise SystemExit(1)

          def sha256_file(path):
              digest = hashlib.sha256()

              with path.open("rb") as stream:
                  for block in iter(
                      lambda: stream.read(1024 * 1024),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest().lower()

          def git_blob_sha(path):
              result = subprocess.run(
                  [
                      "git",
                      "hash-object",
                      "--",
                      path.name,
                  ],
                  cwd=root,
                  check=True,
                  capture_output=True,
                  text=True,
              )

              value = result.stdout.strip().lower()

              if not re.fullmatch(
                  r"[0-9a-f]{40}",
                  value,
              ):
                  fail(
                      f"Invalid Git blob SHA for {path.name}"
                  )

              return value

          def raw_path(path):
              return quote(
                  path.name,
                  safe="",
              )

          def clean(value):
              return (
                  str(value)
                  .replace("|", "")
                  .replace("\r", "")
                  .replace("\n", "")
              )

          def make_row(
              item_type,
              path,
              version="",
              character="",
              base_name="",
              private_metadata="",
              changelog="",
          ):
              fields = [
                  item_type,
                  path.name,
                  raw_path(path),
                  git_blob_sha(path),
                  sha256_file(path),
                  str(path.stat().st_size),
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ]

              return "|".join(
                  clean(field)
                  for field in fields
              )

          def version_key(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )

          files = sorted(
              (
                  path
                  for path in root.iterdir()
                  if path.is_file()
                  and path.name != index_name
              ),
              key=lambda path: path.name.casefold(),
          )

          if not files:
              fail(
                  "No files were found in the repository root"
              )

          by_name = {}

          for path in files:
              key = path.name.casefold()

              if key in by_name:
                  fail(
                      f"Duplicate root filename: {path.name}"
                  )

              by_name[key] = path

          manager_name = "NLH Mod Manager.vbs"

          manager = by_name.get(
              manager_name.casefold()
          )

          releases = []
          release_private_files = []
          squad_profiles = []
          icons = []
          mods = []
          private_files = []

          for path in files:
              if (
                  manager is not None
                  and path == manager
              ):
                  continue

              match = release_re.fullmatch(
                  path.name
              )

              if match:
                  releases.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              match = release_private_re.fullmatch(
                  path.name
              )

              if match:
                  release_private_files.append(
                      (
                          path,
                          match.group("version"),
                      )
                  )
                  continue

              if (
                  path.name.casefold()
                  == "nlh mod manager squad profiles.txt"
              ):
                  squad_profiles.append(path)
                  continue

              if (
                  path.name.casefold()
                  == "nlh_mm.ico"
              ):
                  icons.append(path)
                  continue

              match = mod_re.fullmatch(
                  path.name
              )

              if match:
                  mods.append(
                      (
                          path,
                          match.group("version"),
                          match.group("character"),
                      )
                  )
                  continue

              if path.name.casefold().endswith(
                  "_private.txt"
              ):
                  private_files.append(path)

          release_by_version = {}

          for path, version in releases:
              if version in release_by_version:
                  fail(
                      "Duplicate public manager release "
                      f"V{version}"
                  )

              release_by_version[version] = path

          required_releases = {
              "1.0": (
                  "NLH Mod Manager Public Release "
                  "V1.0.vbs"
              ),
              "1.1": (
                  "NLH Mod Manager Public Release "
                  "V1.1.vbs"
              ),
          }

          for version, required_name in (
              required_releases.items()
          ):
              path = release_by_version.get(
                  version
              )

              if path is None:
                  fail(
                      "Required release is missing: "
                      f"{required_name}"
                  )

              if path.name != required_name:
                  fail(
                      f"Release V{version} must be "
                      f"named exactly: {required_name}"
                  )

          rows = []

          if manager is not None:
              rows.append(
                  make_row(
                      "MANAGER",
                      manager,
                      base_name=manager.stem,
                  )
              )

          for path, version in sorted(
              releases,
              key=lambda item: version_key(item[1]),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold() in by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "RELEASE",
                      path,
                      version=version,
                      base_name=base_name,
                      private_metadata=private_metadata,
                  )
              )

          for path, version in sorted(
              release_private_files,
              key=lambda item: version_key(item[1]),
          ):
              rows.append(
                  make_row(
                      "RELEASE_PRIVATE",
                      path,
                      version=version,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          for path in sorted(
              squad_profiles,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "SQUAD_PROFILES",
                      path,
                      base_name=path.stem,
                  )
              )

          for path in sorted(
              icons,
              key=lambda item: item.name.casefold(),
          ):
              rows.append(
                  make_row(
                      "ICON",
                      path,
                      base_name=path.stem,
                  )
              )

          for path, version, character in sorted(
              mods,
              key=lambda item: (
                  item[2].casefold(),
                  version_key(item[1]),
                  item[0].name.casefold(),
              ),
          ):
              base_name = path.stem

              private_name = (
                  f"{base_name}_Private.txt"
              )

              changelog_name = (
                  f"{base_name}_Changelog.txt"
              )

              private_metadata = (
                  private_name
                  if private_name.casefold() in by_name
                  else ""
              )

              changelog = (
                  changelog_name
                  if changelog_name.casefold() in by_name
                  else ""
              )

              rows.append(
                  make_row(
                      "MOD",
                      path,
                      version=version,
                      character=character,
                      base_name=base_name,
                      private_metadata=private_metadata,
                      changelog=changelog,
                  )
              )

          release_private_names = {
              path.name.casefold()
              for path, unused_version
              in release_private_files
          }

          for path in sorted(
              private_files,
              key=lambda item: item.name.casefold(),
          ):
              if (
                  path.name.casefold()
                  in release_private_names
              ):
                  continue

              rows.append(
                  make_row(
                      "PRIVATE",
                      path,
                      base_name=path.name[
                          : -len("_Private.txt")
                      ],
                  )
              )

          index_text = (
              "\n".join(
                  [
                      signature,
                      header,
                      *rows,
                  ]
              )
              + "\n"
          )

          index_path.write_text(
              index_text,
              encoding="utf-8",
              newline="\n",
          )

          lines = index_path.read_text(
              encoding="utf-8"
          ).splitlines()

          if len(lines) < 2:
              fail(
                  "Generated release index is incomplete"
              )

          if lines[0] != signature:
              fail(
                  "Generated release index signature "
                  "is invalid"
              )

          if lines[1] != header:
              fail(
                  "Generated release index header "
                  "is invalid"
              )

          records = {}

          for line_number, line in enumerate(
              lines[2:],
              start=3,
          ):
              fields = line.split("|")

              if len(fields) != 11:
                  fail(
                      f"Index line {line_number} has "
                      f"{len(fields)} fields instead of 11"
                  )

              (
                  item_type,
                  name,
                  stored_raw,
                  stored_blob,
                  stored_hash,
                  stored_size,
                  version,
                  character,
                  base_name,
                  private_metadata,
                  changelog,
              ) = fields

              path = by_name.get(
                  name.casefold()
              )

              if path is None:
                  fail(
                      f"Indexed file is unavailable: {name}"
                  )

              if stored_raw != raw_path(path):
                  fail(
                      f"RAW_PATH mismatch for {name}"
                  )

              expected_blob = git_blob_sha(path)

              if stored_blob != expected_blob:
                  fail(
                      f"Git blob SHA mismatch for {name}"
                  )

              expected_hash = sha256_file(path)

              if stored_hash != expected_hash:
                  fail(
                      f"SHA-256 mismatch for {name}"
                  )

              expected_size = str(
                  path.stat().st_size
              )

              if stored_size != expected_size:
                  fail(
                      f"Size mismatch for {name}"
                  )

              key = name.casefold()

              if key in records:
                  fail(
                      "Duplicate NAME in generated "
                      f"index: {name}"
                  )

              records[key] = fields

          for version, required_name in (
              required_releases.items()
          ):
              record = records.get(
                  required_name.casefold()
              )

              if record is None:
                  fail(
                      "Required release is absent from "
                      f"generated index: {required_name}"
                  )

              if record[0] != "RELEASE":
                  fail(
                      f"Incorrect TYPE for {required_name}: "
                      f"{record[0]}"
                  )

              if record[6] != version:
                  fail(
                      f"Incorrect VERSION for "
                      f"{required_name}: {record[6]}"
                  )

          print(
              f"Generated {index_name} "
              f"with {len(rows)} records"
          )

          for version in ("1.0", "1.1"):
              required_name = (
                  required_releases[version]
              )

              record = records[
                  required_name.casefold()
              ]

              print(
                  f"V{version}: "
                  f"size={record[5]} "
                  f"sha256={record[4]} "
                  f"blob={record[3]}"
              )

          print(
              "Release index verification "
              "completed successfully"
          )
          PY

      - name: Display generated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          cat -- "$INDEX_FILE"

      - name: Commit updated release index
        shell: bash
        env:
          INDEX_FILE: NLH Mod Manager Release Index.txt
        run: |
          set -euo pipefail

          if git diff --quiet -- "$INDEX_FILE"; then
            echo "Release index is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$INDEX_FILE"

          git commit \
            -m "Update NLH Mod Manager release index"

          git push \
            origin \
            HEAD:main
